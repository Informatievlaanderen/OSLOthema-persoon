          pattern: ^Locatie$
      required:
        - '@type'
    Adresvoorstelling:
      title: Adresvoorstelling
      type: object
      description: >-
        Meer leesbare voorstelling met enkel de basisgegevens van het adres,
        bedoeld voor het gebruik van een adres als attribuut van een ander
        object.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Adresvoorstelling)
          pattern: ^Adresvoorstelling$
        administratieveEenheidNiveau1:
          type: object
          description: 'Hoogste Administratieve eenheid van het adres, doorgaans een land.'
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        administratieveEenheidNiveau2:
          type: object
          description: >-
            De regio van het adres, doorgaans een provincie of deelstaat of
            gelijkaardig gebied dat typisch meerdere plaatsen omvat.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        adresgebied:
          type: object
          description: >-
            Naam van een geografisch gebied of plaats die een aantal
            adresseerbare objecten groepeert om deze te adresseren zonder dat
            het gebied of de plaats een administratieve eenheid is.
            Bijvoorbeeld: de naam van het gehucht waarin het adres ligt.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        busnummer:
          type: object
          description: >-
            Officieel toegekende alfanumerieke code die wordt toegevoegd aan het
            huisnummer om meerdere gebouweenheden, standplaatsen, ligplaatsen of
            percelen te onderscheiden die eenzelfde huisnummer hebben.
            Specialisatie van Adresvoorstelling:locatieaanduiding ten behoeve
            van Belgische adressen.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        gemeentenaam:
          type: object
          description: Gemeentenaam van het adres.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        huisnummer:
          type: object
          description: >-
            Alfanumerieke code officieel toegekend aan gebouweenheden,
            ligplaatsen, standplaatsen of percelen. Specialisatie van
            Adresvoorstelling:locatieaanduiding ten behoeve van Belgische
            adressen.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        land:
          type: object
          description: Land waarin het adres gelegen is.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        locatieaanduiding:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Alfanumerieke code die de adreslocator uniek identificeert binnen
              de straat, administratieve eenheid etc.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        locatienaam:
          type: array
          description: Lijst van LangString items.
          items:
            type: object
            description: >-
              Naam of omschrijving van het het geografisch object dat de
              adreslocator aanduidt.
            properties:
              '@value':
                type: string
              '@language':
                type: string
                pattern: ^nl$
            required:
              - '@value'
              - '@language'
          minItems: 1
        postbus:
          type: object
          description: Postbusnummer in een postkantoor.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        postcode:
          type: object
          description: >-
            Code waarmee het geografisch gebied dat adressen voor postale
            doeleinden groepeert wordt aangeduid.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        postnaam:
          type: object
          description: >-
            Naam waarmee het geografisch gebied dat adressen voor postale
            doeleinden groepeert wordt aangeduid.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        straatnaam:
          type: object
          description: Straatnaam van het adres.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        volledigAdres:
          type: object
          description: >-
            Het complete adres in één string, al dan niet geformatteerd.
            Vermijdt fouten ten gevolge van het opsplitsen van een adres in zijn
            onderdelen. Geeft de voorgeschreven volgorde van de verschillende
            onderdelen weer.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        verwijstNaar:
          $ref: '#/components/schemas/BelgischAdres'
      required:
        - '@type'
    Identificator:
      title: Identificator
      type: object
      description: Informatie gebruikt om een object uniek te identificeren.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Identificator)
          pattern: ^Identificator$
        identificator:
          type: object
