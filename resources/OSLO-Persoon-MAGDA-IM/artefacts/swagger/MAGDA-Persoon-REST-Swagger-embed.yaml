openapi: 3.1.0
info:
  title: MAGDA persoon.personen REST
  description: >-
    Raadpleegt de gegevens van een persoon die is ingeschreven in een register,
    op basis van het INSZ. De gegevens komen uit het Rijksregister (RR) of de
    Kruispuntbank van de Sociale Zekerheid (KSZ), volgen het OSLO
    Persoon-model en worden teruggegeven in JSON-LD. De huidige versie is een
    MVP voorzien van de meest populaire informatietypes (IT's).
  version: 0.4.0
  contact:
    name: MAGDA Service Desk
    url: 'https://vlaamseoverheid.atlassian.net/servicedesk/customer/portal/2038'
  license:
    name: Gebruiksvoorwaarden
    url: >-
      https://vlaamseoverheid.atlassian.net/wiki/spaces/MG/pages/9056387121/persoon.personen+-+v1#Gebruiksvoorwaarden
  x-guidelines-version: '1.0.0'
externalDocs:
  description: Gebruikersdocumentatie REST services - Persoon
  url: >-
    https://vlaamseoverheid.atlassian.net/wiki/spaces/MG/pages/9057959989/REST+services+-+Persoon
servers:
  - url: /v1/persoon
    description: Basis URL
components:
  schemas:
    Woonvormtype:
      title: Woonvormtype
      type: object
      description: Enumeratie van Woonvormtype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    RedenAfwezigheid:
      title: RedenAfwezigheid
      type: object
      description: Enumeratie van RedenAfwezigheid
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    AfstammingOpgaandelijntype:
      title: AfstammingOpgaandelijntype
      type: object
      description: Enumeratie van AfstammingOpgaandelijntype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    AfstammingDalendelijnstype:
      title: AfstammingDalendelijnstype
      type: object
      description: Enumeratie van AfstammingDalendelijnstype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Geslacht:
      title: Geslacht
      type: object
      description: Enumeratie van Geslacht
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    BurgerlijkeStaatType:
      title: BurgerlijkeStaatType
      type: object
      description: Enumeratie van BurgerlijkeStaatType
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    ProcedureType:
      title: ProcedureType
      type: object
      description: Enumeratie van ProcedureType
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    DomicilieStatus:
      title: DomicilieStatus
      type: object
      description: Enumeratie van DomicilieStatus
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    AdministratiefBeheerdertype:
      title: AdministratiefBeheerdertype
      type: object
      description: Enumeratie van AdministratiefBeheerdertype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Dossierstatus:
      title: Dossierstatus
      type: object
      description: Enumeratie van Dossierstatus
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Omstandigheid:
      title: Omstandigheid
      type: object
      description: Enumeratie van Omstandigheid
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Gezinsrelatietype:
      title: Gezinsrelatietype
      type: object
      description: Enumeratie van Gezinsrelatietype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    UitzonderingOorsprong:
      title: UitzonderingOorsprong
      type: object
      description: Enumeratie van UitzonderingOorsprong
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    UitzonderingType:
      title: UitzonderingType
      type: object
      description: Enumeratie van UitzonderingType
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Persoon:
      title: Persoon
      type: object
      description: Natuurlijk persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Persoon)
          pattern: ^Persoon$
        voornaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de
              Persoon van de andere personen in de familie.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        achternaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Gedeelte van de volledige naam van de Persoon ontvangen van de
              vorige generatie. Ook wel familienaam genoemd omdat de achternaam
              een familiale verwantschap aanduidt.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        contactinfo:
          $ref: '#/components/schemas/Contactinfo'
        geslacht:
          $ref: '#/components/schemas/Geslacht'
        isHoofdVan:
          $ref: '#/components/schemas/Gezin'
        heeftBurgerlijkeStaat:
          $ref: '#/components/schemas/BurgerlijkeStaat'
        heeftGeboorte:
          $ref: '#/components/schemas/Geboorte'
        heeftOverlijden:
          $ref: '#/components/schemas/Overlijden'
        heeftInwonerschap:
          type: array
          description: Lijst van Inwonerschap items.
          items:
            $ref: '#/components/schemas/Inwonerschap'
          minItems: 1
        heeftPersoonsrelatie:
          type: array
          description: Lijst van Persoonsrelatie items.
          items:
            oneOf:
              - $ref: '#/components/schemas/Gezinsrelatie'
              - $ref: '#/components/schemas/Huwelijk'
              - $ref: '#/components/schemas/Samenwonen'
              - $ref: '#/components/schemas/AfstammingDalendeLijn'
              - $ref: '#/components/schemas/AfstammingOpgaandeLijn'
            discriminator:
              propertyName: '@type'
              mapping:
                Gezinsrelatie: '#/components/schemas/Gezinsrelatie'
                Huwelijk: '#/components/schemas/Huwelijk'
                Samenwonen: '#/components/schemas/Samenwonen'
                AfstammingDalendeLijn: '#/components/schemas/AfstammingDalendeLijn'
                AfstammingOpgaandeLijn: '#/components/schemas/AfstammingOpgaandeLijn'
          minItems: 1
        isLidVan:
          type: array
          description: Lijst van Gezin items.
          items:
            $ref: '#/components/schemas/Gezin'
          minItems: 1
        creatiedatum:
          type: object
          description: Datum waarop de gegevens zijn ingevoerd.
          properties:
            '@value':
              type: string
              format: date
            '@type':
              type: string
              pattern: ^Date$
          required:
            - '@value'
            - '@type'
        modificatiedatum:
          type: object
          description: Datum waarop de gegevens werden bijgewerkt.
          properties:
            '@value':
              type: string
              format: date
            '@type':
              type: string
              pattern: ^Date$
          required:
            - '@value'
            - '@type'
        bron:
          $ref: '#/components/schemas/Organisatie'
      required:
        - '@type'
    PersoonReferentie:
      title: PersoonReferentie
      type: object
      description: Natuurlijk persoon waarvan enkel een beperkt aantal gegevens doorgegeven worden.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Persoon)
          pattern: ^Persoon$
        voornaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de
              Persoon van de andere personen in de familie.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        achternaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Gedeelte van de volledige naam van de Persoon ontvangen van de
              vorige generatie. Ook wel familienaam genoemd omdat de achternaam
              een familiale verwantschap aanduidt.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        geslacht:
          $ref: '#/components/schemas/Geslacht'
        heeftGeboorte:
          $ref: '#/components/schemas/Geboorte'
        heeftOverlijden:
          $ref: '#/components/schemas/Overlijden'
      required:
        - '@type'
    Plaats:
      title: Plaats
      type: object
      description: Een ruimtelijk gebied of benoemde plaats.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Plaats)
          pattern: ^Plaats$
        plaatsnaam:
          type: object
          description: Naam van de plaats of van het gebied.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        landcode:
          type: object
          description: Code van het land waartoe de plaats behoort.
          properties:
            '@value':
              type: string
          required:
            - '@value'
      required:
        - '@type'
    Gezinsrelatie:
      title: Gezinsrelatie
      type: object
      description: Relatie tussen leden van eenzelfde gezin.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Gezinsrelatie)
          pattern: ^Gezinsrelatie$
        gezinsrelatietype:
          $ref: '#/components/schemas/Gezinsrelatietype'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              Persoon: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoon: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    Overlijden:
      title: Overlijden
      type: object
      description: Het doodgaan van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Overlijden)
          pattern: ^Overlijden$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Persoonsgebeurtenis:
      title: Persoonsgebeurtenis
      type: object
      description: Belangrijke gebeurtenis in het leven van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Persoonsgebeurtenis)
          pattern: ^Persoonsgebeurtenis$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Geboorte:
      title: Geboorte
      type: object
      description: Het ter wereld komen van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Geboorte)
          pattern: ^Geboorte$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Huwelijk:
      title: Huwelijk
      type: object
      description: >-
        Een door burgerlijk of religieus recht geregelde samenlevingsvorm van
        twee personen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Huwelijk)
          pattern: ^Huwelijk$
        plaats:
          $ref: '#/components/schemas/Plaats'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              Persoon: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoon: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    Registratie:
      title: Registratie
      type: object
      description: Opname van de Persoon in het register.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Registratie)
          pattern: ^Registratie$
        dossierstatus:
          type: array
          description: Lijst van Dossierstatus items.
          items:
            $ref: '#/components/schemas/Dossierstatus'
          minItems: 1
        referentiedossier:
          $ref: '#/components/schemas/Identificator'
        redenAfwezigheid:
          $ref: '#/components/schemas/RedenAfwezigheid'
      required:
        - '@type'
    Versie:
      title: Versie
      type: object
      description: Entiteit gedurende een bepaalde periode in de databank.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Versie)
          pattern: ^Versie$
        creatiedatum:
          type: object
          description: Datum waarop de gegevens zijn ingevoerd.
          properties:
            '@value':
              type: string
              format: date
            '@type':
              type: string
              pattern: ^Date$
          required:
            - '@value'
            - '@type'
        modificatiedatum:
          type: object
          description: Datum waarop de gegevens werden bijgewerkt.
          properties:
            '@value':
              type: string
              format: date
            '@type':
              type: string
              pattern: ^Date$
          required:
            - '@value'
            - '@type'
        bron:
          $ref: '#/components/schemas/Organisatie'
      required:
        - '@type'
    FormeleOrganisatie:
      title: FormeleOrganisatie
      type: object
      description: >-
        Een erkende Organisatie,erkend in brede zin of  meer specifiek in
        juridische zin met bijbehorende rechten en plichten.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse FormeleOrganisatie)
          pattern: ^FormeleOrganisatie$
      required:
        - '@type'
    Problemdetail:
      title: Problemdetail
      type: object
      description: Meer gedetailleerde beschrijving van de fout in een HTTP response.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Problemdetail)
          pattern: ^Problemdetail$
        type:
          type: string
          format: uri
          description: >-
            Aard van de fout. URI van het concept in de MAGDA
            Uitzondering-codelijst, bijvoorbeeld
            https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/30001.
        title:
          type: string
          description: Korte mensleesbare beschrijving van de fout.
        status:
          type: integer
          format: int64
          description: >-
            HTTP foutcode. Zoals beschreven in <a
            href="https://www.rfc-editor.org/rfc/rfc7231">RFC7231</a>.
            Bijvoorbeeld: 404 voor "Not Found".
        detail:
          type: string
          description: Mensleesbare beschrijving van de fout.
        instance:
          type: string
          format: uri
          description: >-
            Verwijzing naar de instantie van het object waarop de fout
            betrekking heeft. Bijvoorbeeld: de verwijzing naar de request.
        errors:
          type: array
          description: Details over de fouten die opgetreden zijn.
          items:
            type: object
            properties:
              '@id':
                type: string
                format: uri
              '@type':
                type: string
                description: Object type (klasse Problemdetail)
                pattern: ^Problemdetail$
              type:
                type: string
                format: uri
                description: Aard van de fout.
              title:
                type: string
                description: Korte mensleesbare beschrijving van de fout.
              detail:
                type: string
                description: Mensleesbare beschrijving van de fout.
            required:
              - '@type'
              - type
              - title
              - detail
      required:
        - '@type'
        - type
        - title
        - detail
    PersonEnvelope:
      title: PersonEnvelope
      type: object
      description: >-
        Enveloppe om Persoon en bijhorende validatiewaarschuwingen uit te
        wisselen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse PersonEnvelope)
          pattern: ^PersonEnvelope$
        warning:
          type: array
          description: Lijst van Uitzondering items.
          items:
            $ref: '#/components/schemas/Uitzondering'
          minItems: 1
        data:
          $ref: '#/components/schemas/GeregistreerdPersoon'
        '@context':
          type: string
          description: URI of the JSON-LD versioned context file for this response.
          pattern: >-
            ^https:\/\/implementatie.data.vlaanderen.be\/doc\/implementatiemodel\/magda\/persoon\/v0.4.0\/context\/persoon.jsonld$
      required:
        - '@type'
        - data
    NietMededeelbaar:
      title: NietMededeelbaar
      type: object
      description: Data die vertrouwelijk is en daardoor niet mag meegedeeld worden.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse NietMededeelbaar)
          pattern: ^NietMededeelbaar$
        sinds:
          type: object
          description: >-
            Datum wanneer de beslissing genomen is dat de informatie
            vertrouwelijk is.
          properties:
            '@value':
              type: string
              format: date
            '@type':
              type: string
              pattern: ^Date$
          required:
            - '@value'
            - '@type'
        periode:
          $ref: '#/components/schemas/Periode'
      required:
        - '@type'
    Inwonerschap:
      title: Inwonerschap
      type: object
      description: Het feit dat een Persoon verblijf houdt in een plaats of land.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Inwonerschap)
          pattern: ^Inwonerschap$
        jurisdictie:
          $ref: '#/components/schemas/Jurisdictie'
        heeftVerblijfplaats:
          type: array
          description: Lijst van Verblijfplaats items.
          items:
            oneOf:
              - $ref: '#/components/schemas/Domicilie'
              - $ref: '#/components/schemas/AangegevenAdres'
              - $ref: '#/components/schemas/VoorlopigeInschrijving'
              - $ref: '#/components/schemas/Contactadres'
              - $ref: '#/components/schemas/Postadres'
              - $ref: '#/components/schemas/Referentieadres'
              - $ref: '#/components/schemas/VerblijfplaatsBuitenlandDomicilie'
              - $ref: '#/components/schemas/VerblijfplaatsBuitenland'
              - $ref: '#/components/schemas/WettelijkVerblijf'
            discriminator:
              propertyName: '@type'
              mapping:
                Domicilie: '#/components/schemas/Domicilie'
                AangegevenAdres: '#/components/schemas/AangegevenAdres'
                VoorlopigeInschrijving: '#/components/schemas/VoorlopigeInschrijving'
                Contactadres: '#/components/schemas/Contactadres'
                Postadres: '#/components/schemas/Postadres'
                Referentieadres: '#/components/schemas/Referentieadres'
                VerblijfplaatsBuitenlandDomicilie: '#/components/schemas/VerblijfplaatsBuitenlandDomicilie'
                VerblijfplaatsBuitenland: '#/components/schemas/VerblijfplaatsBuitenland'
                WettelijkVerblijf: '#/components/schemas/WettelijkVerblijf'
          minItems: 1
      required:
        - '@type'
        - jurisdictie
    Samenwonen:
      title: Samenwonen
      type: object
      description: Regeling waarbij twee personen die niet getrouwd zijn samenleven.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Samenwonen)
          pattern: ^Samenwonen$
        plaats:
          $ref: '#/components/schemas/Plaats'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              Persoon: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoon: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    GeregistreerdPersoon:
      title: GeregistreerdPersoon
      type: object
      description: Persoon waarvan de gegevens zijn ingeschreven in een register.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse GeregistreerdPersoon)
          pattern: ^GeregistreerdPersoon$
        registratie:
          $ref: '#/components/schemas/Identificator'
        registratiedetail:
          $ref: '#/components/schemas/Registratie'
        beheerder:
          type: array
          description: Lijst van AdministratiefBeheerder items.
          items:
            $ref: '#/components/schemas/AdministratiefBeheerder'
          minItems: 1
        voornaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de
              Persoon van de andere personen in de familie.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        achternaam:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Gedeelte van de volledige naam van de Persoon ontvangen van de
              vorige generatie. Ook wel familienaam genoemd omdat de achternaam
              een familiale verwantschap aanduidt.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        contactinfo:
          $ref: '#/components/schemas/Contactinfo'
        geslacht:
          $ref: '#/components/schemas/Geslacht'
        isHoofdVan:
          $ref: '#/components/schemas/Gezin'
        heeftBurgerlijkeStaat:
          $ref: '#/components/schemas/BurgerlijkeStaat'
        heeftGeboorte:
          $ref: '#/components/schemas/Geboorte'
        heeftOverlijden:
          $ref: '#/components/schemas/Overlijden'
        heeftInwonerschap:
          type: array
          description: Lijst van Inwonerschap items.
          items:
            $ref: '#/components/schemas/Inwonerschap'
          minItems: 1
        heeftPersoonsrelatie:
          type: array
          description: Lijst van Persoonsrelatie items.
          items:
            oneOf:
              - $ref: '#/components/schemas/Gezinsrelatie'
              - $ref: '#/components/schemas/Huwelijk'
              - $ref: '#/components/schemas/Samenwonen'
              - $ref: '#/components/schemas/AfstammingDalendeLijn'
              - $ref: '#/components/schemas/AfstammingOpgaandeLijn'
            discriminator:
              propertyName: '@type'
              mapping:
