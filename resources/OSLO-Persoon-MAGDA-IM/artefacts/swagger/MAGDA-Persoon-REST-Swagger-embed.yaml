          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        huisnummer:
          type: object
          description: >-
            Alfanumerieke code officieel toegekend aan gebouweenheden,
            ligplaatsen, standplaatsen of percelen. Specialisatie van
            Adresvoorstelling:locatieaanduiding ten behoeve van Belgische
            adressen.
          properties:
            '@value':
              type: string
          required:
            - '@value'
