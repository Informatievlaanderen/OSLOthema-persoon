          description: Land waarin het adres gelegen is.
          properties:
            '@value':
              type: string
            '@language':
              type: string
              pattern: ^nl$
          required:
            - '@value'
            - '@language'
        locatieaanduiding:
          type: array
          description: Lijst van String items.
          items:
            type: object
            description: >-
              Alfanumerieke code die de adreslocator uniek identificeert binnen
              de straat, administratieve eenheid etc.
            properties:
              '@value':
                type: string
            required:
              - '@value'
          minItems: 1
        locatienaam:
          type: array
          description: Lijst van LangString items.
          items:
            type: object
            description: >-
              Naam of omschrijving van het het geografisch object dat de
              adreslocator aanduidt.
            properties:
              '@value':
                type: string
              '@language':
                type: string
                pattern: ^nl$
            required:
              - '@value'
              - '@language'
          minItems: 1
        postbus:
          type: object
          description: Postbusnummer in een postkantoor.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        postcode:
          type: object
          description: >-
            Code waarmee het geografisch gebied dat adressen voor postale
            doeleinden groepeert wordt aangeduid.
          properties:
            '@value':
              type: string
          required:
            - '@value'
        postnaam:
