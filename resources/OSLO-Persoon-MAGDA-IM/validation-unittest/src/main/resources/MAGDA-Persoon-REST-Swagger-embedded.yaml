  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      required: true
      in: header
      description: >-
        Correlatie ID van het request, in UUID-formaat. De response bevat
        dezelfde waarde in de X-Correlation-Id header.
      schema:
        type: string
        format: uuid
    XRequestId:
      name: X-Request-Id
      required: false
      in: header
      description: >-
        Unieke ID van het request, in UUID-formaat. Indien niet
        meegegeven, genereert de dienst een waarde.
      schema:
        type: string
        format: uuid
  headers:
    XCorrelationId:
      description: >-
        Correlatie ID van het request. Gelijk aan de waarde van de
        X-Correlation-Id header in het request.
      schema:
        type: string
        format: uuid
paths:
  /personen:
    get:
      summary: Persoon waarvan de gegevens zijn ingeschreven in een register.
      description: Persoon waarvan de gegevens zijn ingeschreven in een register.
      operationId: PersoonGET
      security:
        - OAuth2:
            - persoon_personen_v1
      parameters:
        - name: X-INSZ
          required: true
          in: header
          description: INSZ van een GeregistreerdPersoon object.
          schema:
            type: string
            pattern: '^\d{11}$'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XRequestId'
        - name: source
          required: true
          in: query
          description: Bron die geraadpleegd moet worden om de Persoon op te vragen.
          schema:
            type: string
            pattern: ^(RR|KSZ)$
          examples:
            RR:
              summary: Rijksregister (OVO027248)
              value: RR
            KSZ:
              summary: Kruispuntbank van de Sociale Zekerheid (OVO008218)
              value: KSZ
        - name: embed
          required: false
          in: query
          description: >-
            Extra ITs die moeten worden opgevraagd die niet standaard bij de
            bron worden meegegeven. Indien niet meegegeven zal deze extra
            informatie niet in het antwoord zitten.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: ^(Afstamming|AfstammingDalendeLijn)$
          examples:
            IT110:
              summary: Afstamming (IT 110)
              value:
                - Afstamming
            IT114:
              summary: Afstamming in dalende lijn (IT 114)
              value:
                - AfstammingDalendeLijn
            IT110-IT114:
              summary: Afstamming (IT 110) en Afstamming in dalende lijn (IT 114)
              value:
                - Afstamming
                - AfstammingDalendeLijn
      responses:
        '200':
          description: |-
            GeregistreerdPersoon object gevonden.

            Niet-blokkerende uitzonderingen worden teruggegeven in de `warning`-array van de PersonEnvelope.
            Elke uitzondering krijgt een eigen entry; de volgorde van de bron blijft behouden.
            Het type van een uitzondering is `https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/{code}`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/PersonEnvelope'
        '400':
          description: >-
            Bad Request. De vraag bevat ongeldige of ontbrekende gegevens.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problemdetail'
              examples:
                '20002':
                  summary: '20002 Ongeldig INSZ formaat'
                  value:
                    '@type': Problemdetail
                    type: 'https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/20002'
                    title: 'Ongeldig INSZ formaat'
                    status: 400
                    detail: 'INSZ in de vraag heeft een ongeldige structuur.'
                '40102':
                  summary: '40102 Geen gegevensgroepen opgegeven'
                  value:
                    '@type': Problemdetail
                    type: 'https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/40102'
                    title: 'Geen gegevensgroepen opgegeven'
                    status: 400
                    detail: 'Er werden geen gegevensgroepen opgegeven in de vraag.'
        '401':
          description: >-
            Unauthorized. Authenticatie van de client is mislukt.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problemdetail'
              examples:
                '40006':
                  summary: '40006 Autorisatiefout'
                  value:
                    '@type': Problemdetail
                    type: 'https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/40006'
                    title: 'Autorisatiefout'
                    status: 401
                    detail: 'Fout in autorisatie.'
        '403':
          description: >-
            Forbidden. De client is geauthenticeerd, maar heeft geen toegang tot de gevraagde gegevens.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problemdetail'
              examples:
                '40001':
                  summary: '40001 Geen geldige wettelijke context'
                  value:
                    '@type': Problemdetail
                    type: 'https://data.vlaanderen.be/id/concept/MAGDA/Uitzondering/40001'
                    title: 'Geen geldige wettelijke context'
                    status: 403
                    detail: 'Er werd geen geldige wettelijke context opgegeven.'
                '40201':
                  summary: '40201 Opvraging overlijden niet toegestaan'
