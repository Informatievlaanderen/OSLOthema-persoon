openapi: 3.1.0
info:
  title: MAGDA persoon.personen REST
  description: >-
    Raadpleegt de gegevens van een persoon die is ingeschreven in een register,
    op basis van het INSZ. De gegevens komen uit het Rijksregister (RR) of de
    Kruispuntbank van de Sociale Zekerheid (KSZ), volgen het OSLO
    Persoon-model en worden teruggegeven in JSON-LD. De huidige versie is een
    MVP voorzien van de meest populaire informatietypes (IT's).
  version: 0.4.0
  contact:
    name: MAGDA Service Desk
    url: 'https://vlaamseoverheid.atlassian.net/servicedesk/customer/portal/2038'
  license:
    name: Gebruiksvoorwaarden
    url: >-
      https://vlaamseoverheid.atlassian.net/wiki/spaces/MG/pages/9056387121/persoon.personen+-+v1#Gebruiksvoorwaarden
  x-guidelines-version: '1.0.0'
externalDocs:
  description: Gebruikersdocumentatie REST services - Persoon
  url: >-
    https://vlaamseoverheid.atlassian.net/wiki/spaces/MG/pages/9057959989/REST+services+-+Persoon
servers:
  - url: /v1/persoon
    description: Basis URL
components:
  schemas:
    Woonvormtype:
      title: Woonvormtype
      type: object
      description: Enumeratie van Woonvormtype
      properties:
        '@id':
          type: string
