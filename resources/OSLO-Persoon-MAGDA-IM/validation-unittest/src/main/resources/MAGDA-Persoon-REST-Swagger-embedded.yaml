          format: uri
      required:
        - '@id'
    Persoon.voornaam:
      title: Persoon.voornaam
      type: object
      description: Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de Persoon van de andere personen in de familie.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    Persoon.achternaam:
      title: Persoon.achternaam
      type: object
      description: Gedeelte van de volledige naam van de Persoon ontvangen van de vorige generatie. Ook wel familienaam genoemd omdat de achternaam een familiale verwantschap aanduidt.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    Persoon.creatiedatum:
      title: Persoon.creatiedatum
      type: object
      description: Datum waarop de gegevens zijn ingevoerd.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    Persoon.modificatiedatum:
      title: Persoon.modificatiedatum
      type: object
      description: Datum waarop de gegevens werden bijgewerkt.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    Persoon:
      title: Persoon
      type: object
      description: Natuurlijk persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Persoon)
          pattern: ^Persoon$
        voornaam:
          type: array
          description: Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de Persoon van de andere personen in de familie. Lijst van String items.
          items:
            $ref: '#/components/schemas/Persoon.voornaam'
          minItems: 1
        achternaam:
          type: array
          description: Gedeelte van de volledige naam van de Persoon ontvangen van de vorige generatie. Ook wel familienaam genoemd omdat de achternaam een familiale verwantschap aanduidt. Lijst van String items.
          items:
            $ref: '#/components/schemas/Persoon.achternaam'
          minItems: 1
        contactinfo:
          $ref: '#/components/schemas/Contactinfo'
        geslacht:
          $ref: '#/components/schemas/Geslacht'
        isHoofdVan:
          $ref: '#/components/schemas/Gezin'
        heeftBurgerlijkeStaat:
          $ref: '#/components/schemas/BurgerlijkeStaat'
        heeftGeboorte:
          $ref: '#/components/schemas/Geboorte'
        heeftOverlijden:
          $ref: '#/components/schemas/Overlijden'
        heeftInwonerschap:
          type: array
          description: Inwonerschap van de persoon. Lijst van Inwonerschap items.
          items:
            $ref: '#/components/schemas/Inwonerschap'
          minItems: 1
        heeftPersoonsrelatie:
          type: array
          description: Persoonsrelatie van de persoon. Lijst van Persoonsrelatie items.
          items:
            oneOf:
              - $ref: '#/components/schemas/Gezinsrelatie'
              - $ref: '#/components/schemas/Huwelijk'
              - $ref: '#/components/schemas/Samenwonen'
              - $ref: '#/components/schemas/AfstammingDalendeLijn'
              - $ref: '#/components/schemas/AfstammingOpgaandeLijn'
            discriminator:
              propertyName: '@type'
              mapping:
                Gezinsrelatie: '#/components/schemas/Gezinsrelatie'
                Huwelijk: '#/components/schemas/Huwelijk'
                Samenwonen: '#/components/schemas/Samenwonen'
                AfstammingDalendeLijn: '#/components/schemas/AfstammingDalendeLijn'
                AfstammingOpgaandeLijn: '#/components/schemas/AfstammingOpgaandeLijn'
          minItems: 1
        isLidVan:
          type: array
          description: Persoon die tot een Gezin behoort. Lijst van Gezin items.
          items:
            $ref: '#/components/schemas/Gezin'
          minItems: 1
        creatiedatum:
          $ref: '#/components/schemas/Persoon.creatiedatum'
        modificatiedatum:
          $ref: '#/components/schemas/Persoon.modificatiedatum'
        bron:
          $ref: '#/components/schemas/Organisatie'
      required:
        - '@type'
    Plaats.plaatsnaam:
      title: Plaats.plaatsnaam
      type: object
      description: Naam van de plaats of van het gebied.
      properties:
        '@value':
          type: string
        '@language':
          type: string
          pattern: ^nl$
      required:
        - '@value'
        - '@language'
    Plaats.landcode:
      title: Plaats.landcode
      type: object
      description: Code van het land waartoe de plaats behoort.
      properties:
        '@value':
          type: string
        '@type':
          type: string
      required:
        - '@value'
    Plaats:
      title: Plaats
      type: object
      description: Een ruimtelijk gebied of benoemde plaats.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Plaats)
          pattern: ^Plaats$
        plaatsnaam:
          $ref: '#/components/schemas/Plaats.plaatsnaam'
        landcode:
          $ref: '#/components/schemas/Plaats.landcode'
      required:
        - '@type'
    Gezinsrelatie:
      title: Gezinsrelatie
      type: object
      description: Relatie tussen leden van eenzelfde gezin.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Gezinsrelatie)
          pattern: ^Gezinsrelatie$
        gezinsrelatietype:
          $ref: '#/components/schemas/Gezinsrelatietype'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              PersoonReferentie: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    Overlijden:
      title: Overlijden
      type: object
      description: Het doodgaan van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Overlijden)
          pattern: ^Overlijden$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Persoonsgebeurtenis:
      title: Persoonsgebeurtenis
      type: object
      description: Belangrijke gebeurtenis in het leven van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Persoonsgebeurtenis)
          pattern: ^Persoonsgebeurtenis$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Geboorte:
      title: Geboorte
      type: object
      description: Het ter wereld komen van een Persoon.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Geboorte)
          pattern: ^Geboorte$
        plaats:
          $ref: '#/components/schemas/Plaats'
        datum:
          $ref: '#/components/schemas/Moment'
      required:
        - '@type'
    Huwelijk:
      title: Huwelijk
      type: object
      description: "Een door burgerlijk of religieus recht geregelde\_samenlevingsvorm van twee personen."
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Huwelijk)
          pattern: ^Huwelijk$
        plaats:
          $ref: '#/components/schemas/Plaats'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              PersoonReferentie: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    Registratie:
      title: Registratie
      type: object
      description: Opname van de Persoon in het register.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Registratie)
          pattern: ^Registratie$
        dossierstatus:
          type: array
          description: 'Toestand van het dossier van de Registratie. In het Rijksregister gebruikt wanneer de inschrijving in het register niet meer geldig is, bijvoorbeeld: omdat de persoon uit het register is geschrapt of een eerdere registratie werd geannuleerd of de persoon is overleden, etc. Lijst van Dossierstatus items.'
          items:
            $ref: '#/components/schemas/Dossierstatus'
          minItems: 1
        referentiedossier:
          $ref: '#/components/schemas/Identificator'
        redenAfwezigheid:
          $ref: '#/components/schemas/RedenAfwezigheid'
      required:
        - '@type'
    Versie.creatiedatum:
      title: Versie.creatiedatum
      type: object
      description: Datum waarop de gegevens zijn ingevoerd.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    Versie.modificatiedatum:
      title: Versie.modificatiedatum
      type: object
      description: Datum waarop de gegevens werden bijgewerkt.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    Versie:
      title: Versie
      type: object
      description: Entiteit gedurende een bepaalde periode in de databank.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Versie)
          pattern: ^Versie$
        creatiedatum:
          $ref: '#/components/schemas/Versie.creatiedatum'
        modificatiedatum:
          $ref: '#/components/schemas/Versie.modificatiedatum'
        bron:
          $ref: '#/components/schemas/Organisatie'
      required:
        - '@type'
    FormeleOrganisatie:
      title: FormeleOrganisatie
      type: object
      description: Een erkende Organisatie,erkend in brede zin of  meer specifiek in juridische zin met bijbehorende rechten en plichten.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse FormeleOrganisatie)
          pattern: ^FormeleOrganisatie$
      required:
        - '@type'
    Problemdetail.type:
      title: Problemdetail.type
      type: object
      description: Aard van de fout.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          pattern: ^AnyURI$
      required:
        - '@id'
        - '@type'
    Problemdetail.title:
      title: Problemdetail.title
      type: object
      description: Korte mensleesbare beschrijving van de fout.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    Problemdetail.status:
      title: Problemdetail.status
      type: object
      description: 'HTTP foutcode. Zoals beschreven in <a href="https://www.rfc-editor.org/rfc/rfc7231">RFC7231</a>. Bijvoorbeeld: 404 voor "Not Found".'
      properties:
        '@value':
          type: integer
          format: int64
        '@type':
          type: string
          pattern: ^Integer$
      required:
        - '@value'
        - '@type'
    Problemdetail.detail:
      title: Problemdetail.detail
      type: object
      description: Mensleesbare beschrijving van de fout.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    Problemdetail.instance:
      title: Problemdetail.instance
      type: object
      description: 'Verwijzing naar de instantie van het object waarop de fout betrekking heeft. Bijvoorbeeld: de verwijzing naar de request.'
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          pattern: ^AnyURI$
      required:
        - '@id'
        - '@type'
    Problemdetail:
      title: Problemdetail
      type: object
      description: Meer gedetailleerde beschrijving van de fout in een HTTP response.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Problemdetail)
          pattern: ^Problemdetail$
        type:
          $ref: '#/components/schemas/Problemdetail.type'
        title:
          $ref: '#/components/schemas/Problemdetail.title'
        status:
          $ref: '#/components/schemas/Problemdetail.status'
        detail:
          $ref: '#/components/schemas/Problemdetail.detail'
        instance:
          $ref: '#/components/schemas/Problemdetail.instance'
        errors:
          type: array
          description: Mogelijke validatie-fouten die de aanleiding geven voor het probleem. Lijst van Error items.
          items:
            $ref: '#/components/schemas/Error'
          minItems: 1
      required:
        - '@type'
        - type
        - title
        - detail
    PersonEnvelope:
      title: PersonEnvelope
      type: object
      description: Enveloppe om Persoon en bijhorende validatiewaarschuwingen uit te wisselen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse PersonEnvelope)
          pattern: ^PersonEnvelope$
        warning:
          type: array
          description: Foutmeldingen die opgetreden zijn bij het afleveren van de data. Foutmeldingen kunnen ook optreden bij HTTP 200 waarbij validatiefouten worden meegegeven zoals MAGDA Uitzonderingen. Lijst van Uitzondering items.
          items:
            $ref: '#/components/schemas/Uitzondering'
          minItems: 1
        data:
          $ref: '#/components/schemas/GeregistreerdPersoon'
        '@context':
          type: string
          description: URI of the JSON-LD versioned context file for this response.
          pattern: ^https:\/\/implementatie.data.vlaanderen.be\/doc\/implementatiemodel\/magda\/persoon\/v0.4.0\/context\/persoon.jsonld$
      required:
        - '@type'
        - data
    NietMededeelbaar.sinds:
      title: NietMededeelbaar.sinds
      type: object
      description: Datum wanneer de beslissing genomen is dat de informatie vertrouwelijk is.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    NietMededeelbaar:
      title: NietMededeelbaar
      type: object
      description: Data die vertrouwelijk is en daardoor niet mag meegedeeld worden.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse NietMededeelbaar)
          pattern: ^NietMededeelbaar$
        sinds:
          $ref: '#/components/schemas/NietMededeelbaar.sinds'
        periode:
          $ref: '#/components/schemas/Periode'
      required:
        - '@type'
    Inwonerschap:
      title: Inwonerschap
      type: object
      description: Het feit dat een Persoon verblijf houdt in een plaats of land.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Inwonerschap)
          pattern: ^Inwonerschap$
        jurisdictie:
          $ref: '#/components/schemas/Jurisdictie'
        heeftVerblijfplaats:
          type: array
          description: Plaats waar een persoon verblijft. Lijst van Verblijfplaats items.
          items:
            oneOf:
              - $ref: '#/components/schemas/Domicilie'
              - $ref: '#/components/schemas/AangegevenAdres'
              - $ref: '#/components/schemas/VoorlopigeInschrijving'
              - $ref: '#/components/schemas/Contactadres'
              - $ref: '#/components/schemas/Postadres'
              - $ref: '#/components/schemas/Referentieadres'
              - $ref: '#/components/schemas/VerblijfplaatsBuitenlandDomicilie'
              - $ref: '#/components/schemas/VerblijfplaatsBuitenland'
              - $ref: '#/components/schemas/WettelijkVerblijf'
            discriminator:
              propertyName: '@type'
              mapping:
                Domicilie: '#/components/schemas/Domicilie'
                AangegevenAdres: '#/components/schemas/AangegevenAdres'
                VoorlopigeInschrijving: '#/components/schemas/VoorlopigeInschrijving'
                Contactadres: '#/components/schemas/Contactadres'
                Postadres: '#/components/schemas/Postadres'
                Referentieadres: '#/components/schemas/Referentieadres'
                VerblijfplaatsBuitenlandDomicilie: '#/components/schemas/VerblijfplaatsBuitenlandDomicilie'
                VerblijfplaatsBuitenland: '#/components/schemas/VerblijfplaatsBuitenland'
                WettelijkVerblijf: '#/components/schemas/WettelijkVerblijf'
          minItems: 1
      required:
        - '@type'
        - jurisdictie
    Samenwonen:
      title: Samenwonen
      type: object
      description: Regeling waarbij twee personen die niet getrouwd zijn samenleven.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Samenwonen)
          pattern: ^Samenwonen$
        plaats:
          $ref: '#/components/schemas/Plaats'
        metPersoon:
          oneOf:
            - $ref: '#/components/schemas/PersoonReferentie'
            - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
          discriminator:
            propertyName: '@type'
            mapping:
              PersoonReferentie: '#/components/schemas/PersoonReferentie'
              GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
      required:
        - '@type'
        - metPersoon
    GeregistreerdPersoon.voornaam:
      title: GeregistreerdPersoon.voornaam
      type: object
      description: Naam die een Persoon bij geboorte wordt gegeven. Onderscheidt de Persoon van de andere personen in de familie.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    GeregistreerdPersoon.achternaam:
      title: GeregistreerdPersoon.achternaam
      type: object
      description: Gedeelte van de volledige naam van de Persoon ontvangen van de vorige generatie. Ook wel familienaam genoemd omdat de achternaam een familiale verwantschap aanduidt.
      properties:
        '@value':
          type: string
      required:
        - '@value'
    GeregistreerdPersoon.creatiedatum:
      title: GeregistreerdPersoon.creatiedatum
      type: object
      description: Datum waarop de gegevens zijn ingevoerd.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    GeregistreerdPersoon.modificatiedatum:
      title: GeregistreerdPersoon.modificatiedatum
      type: object
      description: Datum waarop de gegevens werden bijgewerkt.
      properties:
        '@value':
          type: string
          format: date
        '@type':
          type: string
          pattern: ^Date$
      required:
        - '@value'
        - '@type'
    GeregistreerdPersoon:
      title: GeregistreerdPersoon
